<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Inline Chat (Public) - Chatter Demo</title>
  <link rel="stylesheet" href="/chatter.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a {
      text-decoration: none;
      color: #666;
      font-size: 14px;
    }
    header a:hover {
      color: #1a1a1a;
    }
    #chat-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .footer {
      background: #2d3748;
      color: white;
      text-align: center;
      padding: 40px 20px;
      margin-top: 80px;
    }
    .footer p {
      color: rgba(255, 255, 255, 0.8);
      margin: 0 0 16px 0;
    }
    .footer-chatter-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    .footer-chatter-link:hover {
      transform: translateY(-2px);
    }
    .footer-chatter-link .chatter-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">← Back to Docs</a>
    <div></div>
  </header>

  <div id="chat-container"></div>

  <!-- Footer -->
  <div class="footer">
    <p>Open source • Self-hostable • Built with Bun, Hono, OpenAI, and Turso</p>
    <a href="https://github.com/diegoaltoworks/chatter" target="_blank" class="footer-chatter-link">
      <span class="chatter-icon">⚡</span>
      <span>Built with Chatter</span>
    </a>
  </div>

  <!-- React from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chatter widget script -->
  <script src="/chatter.js"></script>

  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React App -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    async function getOrCreateSession() {
      const STORAGE_KEY = 'solestride_session';

      // Check for existing session
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const session = JSON.parse(stored);
        // Check if still fresh
        if (Date.now() < session.expiresAt) {
          console.log('Reusing cached session');
          return session.key;
        }
      }

      // Create new session
      const response = await fetch('/api/demo/session');
      const data = await response.json();

      // Store with expiration time (5 min safety buffer)
      const session = {
        key: data.key,
        expiresAt: Date.now() + (data.expiresIn * 1000) - (5 * 60 * 1000)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
      console.log('Created new session');

      return session.key;
    }

    function ChatApp() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [sessionKey, setSessionKey] = useState(null);

      useEffect(() => {
        getOrCreateSession()
          .then(key => {
            setSessionKey(key);
          })
          .catch(console.error);
      }, []);

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!input.trim() || loading || !sessionKey) return;

        const userMessage = { role: 'user', content: input };
        setMessages(prev => [...prev, userMessage]);
        setInput('');
        setLoading(true);

        try {
          const response = await fetch('/api/public/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': sessionKey
            },
            body: JSON.stringify({ message: input })
          });

          const data = await response.json();

          if (data.reply) {
            setMessages(prev => [...prev, {
              role: 'assistant',
              content: data.reply
            }]);
          } else if (data.error) {
            setMessages(prev => [...prev, {
              role: 'assistant',
              content: `Error: ${data.error}`
            }]);
          }
        } catch (error) {
          setMessages(prev => [...prev, {
            role: 'assistant',
            content: 'Sorry, an error occurred.'
          }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{
          display: 'flex',
          flexDirection: 'column',
          height: '100%'
        }}>
          <div style={{
            padding: '20px',
            background: '#1a1a1a',
            color: 'white',
            fontWeight: 600
          }}>
            {sessionKey ? 'React Public Chat Demo' : 'Creating session...'}
            <div style={{ fontSize: '14px', fontWeight: 'normal', marginTop: '4px', opacity: 0.9 }}>
              Ask me anything!
            </div>
          </div>

          <div style={{
            flex: 1,
            overflowY: 'auto',
            padding: '20px',
            display: 'flex',
            flexDirection: 'column',
            gap: '16px'
          }}>
            {messages.length === 0 && (
              <div style={{
                textAlign: 'center',
                color: '#999',
                marginTop: '40px'
              }}>
                Send a message to get started
              </div>
            )}
            {messages.map((msg, i) => (
              <div
                key={i}
                style={{
                  alignSelf: msg.role === 'user' ? 'flex-end' : 'flex-start',
                  maxWidth: '70%',
                  padding: '12px 16px',
                  borderRadius: '12px',
                  background: msg.role === 'user' ? '#1a1a1a' : '#f0f0f0',
                  color: msg.role === 'user' ? 'white' : '#1a1a1a',
                  whiteSpace: 'pre-wrap',
                  wordBreak: 'break-word'
                }}
              >
                {msg.content}
              </div>
            ))}
            {loading && (
              <div style={{
                alignSelf: 'flex-start',
                color: '#999',
                fontStyle: 'italic'
              }}>
                Thinking...
              </div>
            )}
          </div>

          <form
            onSubmit={sendMessage}
            style={{
              padding: '16px',
              borderTop: '1px solid #e0e0e0',
              display: 'flex',
              gap: '8px'
            }}
          >
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder={sessionKey ? "Type your message..." : "Creating session..."}
              disabled={!sessionKey || loading}
              style={{
                flex: 1,
                padding: '12px',
                border: '1px solid #e0e0e0',
                borderRadius: '6px',
                fontSize: '14px',
                outline: 'none'
              }}
            />
            <button
              type="submit"
              disabled={!sessionKey || loading || !input.trim()}
              style={{
                padding: '12px 24px',
                background: (!sessionKey || loading || !input.trim()) ? '#ccc' : '#1a1a1a',
                color: 'white',
                border: 'none',
                borderRadius: '6px',
                cursor: (!sessionKey || loading || !input.trim()) ? 'not-allowed' : 'pointer',
                fontWeight: 600
              }}
            >
              Send
            </button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('chat-container'));
    root.render(<ChatApp />);
  </script>
</body>
</html>

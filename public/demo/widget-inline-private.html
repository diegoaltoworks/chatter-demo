<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline Chat Widget (Private) - Chatter Demo</title>
  <link rel="stylesheet" href="/chatter.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a {
      text-decoration: none;
      color: #666;
      font-size: 14px;
    }
    header a:hover {
      color: #1a1a1a;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: #666;
    }
    .user-info button {
      padding: 0.5rem 1rem;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #chat-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none;
    }
    .private-badge {
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      color: white;
      padding: 0.5rem 1rem;
      text-align: center;
      font-weight: 500;
      font-size: 0.9rem;
    }
    #chat-container .chatter-ui-chat {
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 0;
    }
    #chat-container .chatter-ui-chat-header {
      display: none;
    }
    #chat-container .chatter-ui-chat-messages {
      flex: 1;
    }
    #chat-container .chatter-ui-message-user {
      background: #1a1a1a !important;
    }
    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .auth-container h2 {
      margin-bottom: 1rem;
      color: #333;
    }
    .auth-container p {
      color: #666;
      margin-bottom: 2rem;
    }
    #clerk-sign-in {
      width: 100%;
      max-width: 400px;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #666;
      padding: 2rem;
    }
    .footer {
      background: #2d3748;
      color: white;
      text-align: center;
      padding: 40px 20px;
      margin-top: 80px;
    }
    .footer p {
      color: rgba(255, 255, 255, 0.8);
      margin: 0 0 16px 0;
    }
    .footer-chatter-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    .footer-chatter-link:hover {
      transform: translateY(-2px);
    }
    .footer-chatter-link .chatter-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">← Back to Docs</a>
    <div class="user-info" id="userInfo" style="display:none;">
      <span id="userEmail"></span>
      <button id="signOutButton">Sign Out</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="private-badge">
      Private Portal - Enhanced Context & Internal Resources
    </div>
  </div>

  <div class="auth-container" id="authContainer">
    <h2>Authentication Required</h2>
    <p>Please sign in to access the private chat widget.</p>
    <div class="loading" id="loadingClerk">
      <span>Loading authentication...</span>
    </div>
    <div id="clerk-sign-in" style="display:none;"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>Open source • Self-hostable • Built with Bun, Hono, OpenAI, and Turso</p>
    <a href="https://github.com/diegoaltoworks/chatter" target="_blank" class="footer-chatter-link">
      <span class="chatter-icon">⚡</span>
      <span>Built with Chatter</span>
    </a>
  </div>

  <script src="/chatter.js"></script>
  <script>
    let clerkInstance;
    let chatInstance;
    let NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY;

    async function loadConfig() {
      try {
        const response = await fetch('/config');
        const config = await response.json();
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = config.clerkPublishableKey;

        if (!NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY) {
          throw new Error('Clerk publishable key not configured');
        }

        const script = document.createElement('script');
        script.src = `${config.clerkFrontendUrl}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.type = 'text/javascript';
        script.setAttribute('data-clerk-publishable-key', NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY);
        script.onload = initializeClerk;
        script.onerror = () => {
          document.getElementById('loadingClerk').innerHTML =
            '<span style="color:#dc3545;">Failed to load Clerk SDK</span>';
        };
        document.head.appendChild(script);
      } catch (error) {
        console.error('Failed to load config:', error);
        document.getElementById('loadingClerk').innerHTML =
          `<span style="color:#dc3545;">Configuration error: ${error.message}</span>`;
      }
    }

    loadConfig();

    async function initializeClerk() {
      try {
        clerkInstance = window.Clerk;
        await clerkInstance.load();

        if (clerkInstance.user) {
          await showChat();
        } else {
          document.getElementById('loadingClerk').style.display = 'none';
          document.getElementById('clerk-sign-in').style.display = 'block';

          const signInDiv = document.getElementById('clerk-sign-in');
          clerkInstance.mountSignIn(signInDiv, {
            afterSignInUrl: window.location.href,
          });
        }

        clerkInstance.addListener(async (state) => {
          if (state.user) {
            await showChat();
          }
        });
      } catch (error) {
        console.error('Failed to initialize Clerk:', error);
        document.getElementById('loadingClerk').innerHTML =
          '<span style="color:#dc3545;">Authentication service unavailable</span>';
      }
    }

    async function getOrCreateSession() {
      const STORAGE_KEY = 'solestride_session';

      // Check for existing session
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const session = JSON.parse(stored);
        // Check if still fresh
        if (Date.now() < session.expiresAt) {
          console.log('Reusing cached session');
          return session.key;
        }
      }

      // Create new session
      const response = await fetch('/api/demo/session');
      const data = await response.json();

      // Store with expiration time (5 min safety buffer)
      const session = {
        key: data.key,
        expiresAt: Date.now() + (data.expiresIn * 1000) - (5 * 60 * 1000)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
      console.log('Created new session');

      return session.key;
    }

    async function showChat() {
      const user = clerkInstance.user;

      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('chat-container').style.display = 'block';
      document.getElementById('userInfo').style.display = 'flex';
      document.getElementById('userEmail').textContent =
        user.primaryEmailAddress?.emailAddress || 'Private User';

      if (!chatInstance) {
        const token = await clerkInstance.session.getToken();
        const sessionKey = await getOrCreateSession();

        chatInstance = new Chatter.Chat({
          host: window.location.host,
          mode: 'private',
          apiKey: sessionKey,
          token: token,
          container: '#chat-container',
          placeholder: 'Type your message...',
          title: 'Private Chat',
          subtitle: 'Enhanced context & internal resources'
        });
      }
    }

    document.getElementById('signOutButton')?.addEventListener('click', async () => {
      await clerkInstance?.signOut();
      window.location.reload();
    });
  </script>
</body>
</html>
